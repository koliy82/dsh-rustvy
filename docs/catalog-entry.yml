# Запись для каталога awesome-dsh-plugin — файл, который заносит этот плагин
# в общественный каталог, а значит и во встроенный маркет плагинов.
#
#   Куда кладётся:  <форк>/data/plugins/Koliy82__dsh-rustvy.yml
#                   (два подчёркивания между владельцем и репозиторием; для
#                   подпакета в монорепозитории имя файла становится
#                   OWNER__repo--packages-name.yml)
#   Что отправлять: один файл, один pull request, в ветку main того репозитория.
#                   Не правьте его README — они генерируются из этих данных.
#
# Проверьте владельца (Koliy82 взято из git-идентичности) и УДАЛИТЕ ЭТИ
# КОММЕНТАРИИ перед открытием PR: файл записи разбирается CI, и лишний или
# неправильно оформленный ключ превращается в проваленную проверку, а не в обсуждение.
#
# Два правила, которые легко нарушить:
#   - `description.en` — единственное обязательное поле. `zh` необязателен;
#     его отсутствие никогда не является поводом отклонить заявку.
#   - описание, содержащее ": " (двоеточие с пробелом), обязано быть в кавычках,
#     иначе YAML прочитает его как вложенный ключ. Оба описания ниже взяты в
#     двойные кавычки именно поэтому; в одинарных пришлось бы удваивать апострофы.
#
# `url` обязан совпадать с репозиторием точно — через него запись связывается
# с npm-пакетом, по собственному полю `repository` этого пакета.

url: https://github.com/Koliy82/dsh-rustvy
name: Koliy82/dsh-rustvy
category: model
description:
  en: "Vendor marks in the model picker plus a model list kept in step with the provider: mirrors the public catalog and logos to loopback, and regenerates the pi-ai route's models from that route's own endpoint, showing the drift before anything is written."
  zh: "在模型选择器中显示厂商标志，并让模型列表与提供方保持同步：把公开目录与标志镜像到本地回环地址，再依据路由自身的接口重新生成 pi-ai 路由的模型列表，写入之前先显示差异。"

# Необязательно, и только если плагин НЕ публикуется на npm: приложите готовый
# .tgz к GitHub Release и укажите его здесь, чтобы маркет предлагал скачивание
# вместо команды сборки из исходников. Только https на файловом хостинге GitHub.
# `latest/download/` разрешает тег в момент запроса, но имя файла берёт буквально,
# поэтому держите имя без версии — либо закрепите тег, где версия в имени файла
# является обычной практикой.
#
# tarball: https://github.com/Koliy82/dsh-rustvy/releases/latest/download/dsh-rustvy.tgz
